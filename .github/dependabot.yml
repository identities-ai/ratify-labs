# Keep workflow actions current.
#
# Added after every action in this repository pinned a major that GitHub had
# already moved past: checkout and setup-node were still on v4, whose Node 20
# runtime is deprecated, and the runner had begun forcing them onto Node 24 and
# warning on every run. Nothing was watching for that, so it surfaced as a
# warning nobody owned rather than a pull request someone could merge.
#
# Actions only. The npm tree is deliberately not included here: it moves far
# more often, and a flood of dependency pull requests is how a repository learns
# to ignore them.
# Weekly rather than monthly. Monthly is how several actions here ended up
# multiple majors behind: a deprecation announced in advance had a month to sit
# unnoticed, and by the time anything surfaced the fix was a batch rather than a
# single bump. Actions change rarely enough that weekly is a small queue.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
