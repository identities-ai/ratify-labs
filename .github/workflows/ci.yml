name: CI

# Verify every change and deploy the verified main build.
#
# Until now this repository had no CI at all: three pull requests merged with no
# checks reported, verified only by whatever their author happened to run
# locally. That is also how three lint errors reached main, because `npm test`
# builds and tests without linting.
#
# The deploy job is restricted to pushes on main and uses the production
# environment for an explicit approval boundary.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Verification runs may be superseded. A production deployment must finish
  # once it starts so a second push cannot cancel an upload halfway through.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      # Runs before the build, because a route pointing at an unpublished
      # reference should fail the pipeline rather than be built and shipped.
      - name: Route registry
        run: npm run check:routes

      - name: Build
        run: npm run build

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Types
        run: npm run typecheck

      # In the gate deliberately. A check that is not in the gate is not run,
      # and this one has already let errors through.
      - name: Lint
        run: npm run lint

      - name: Dependency advisories
        run: npm audit --audit-level=high

  deploy:
    name: Deploy Worker
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://labs.ratifyprotocol.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }

      - name: Install from the lockfile
        run: npm ci

      - name: Build the deployment artifact
        run: npm run build

      - name: Validate target and restore Worker variables
        run: |
          set -euo pipefail
          cfg=dist/server/wrangler.json
          test "$(jq -r '.name // empty' "$cfg")" = ratify-labs || {
            echo "::error::generated config targets an unexpected Worker"; exit 1;
          }
          jq '.vars = {
            "LABS_HOSTNAME": "labs.ratifyprotocol.com",
            "MARITIME_ORIGIN": "https://ratify-maritime-lab.chuksy0x01.chatgpt.site"
          }' "$cfg" > "$cfg.tmp"
          mv "$cfg.tmp" "$cfg"
          jq -e '.vars.LABS_HOSTNAME and .vars.MARITIME_ORIGIN' "$cfg" >/dev/null

      - name: Record build fingerprint
        id: fingerprint
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find dist/client/_next/static -type f -name 'index-*.js' -print | sort)
          test "${#scripts[@]}" -eq 1 || {
            echo "::error::expected exactly one catalog index script, found ${#scripts[@]}"; exit 1;
          }
          fingerprint="$(basename "${scripts[0]}")"
          echo "script=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "build fingerprint: $fingerprint"

      - name: Record deployed version
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          value="$(npx wrangler deployments list --name ratify-labs --json | jq -r '
            if type == "array" then .[0].id // empty
            else .deployments[0].id // .items[0].id // empty end')"
          echo "version=${value:-none}" >> "$GITHUB_OUTPUT"

      - name: Deploy the exact build artifact
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config dist/server/wrangler.json 2>&1 | tee deploy.log
          version="$(sed -n 's/.*Current Version ID: \([0-9a-f-]\{36\}\).*/\1/p' deploy.log | tail -1)"
          test -n "$version" || { echo "::error::Wrangler did not report a version ID"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require a new deployed version
        run: |
          set -euo pipefail
          expected="${{ steps.deploy.outputs.version }}"
          before="${{ steps.before.outputs.version }}"
          test "$expected" != "$before" || { echo "::error::deployment version did not change"; exit 1; }
          echo "deployed new version $expected"

      - name: Verify the live build fingerprint
        env:
          EXPECTED_SCRIPT: ${{ steps.fingerprint.outputs.script }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            html="$(curl -fsS -H 'Cache-Control: no-cache' https://labs.ratifyprotocol.com/ || true)"
            if grep -Fq "$EXPECTED_SCRIPT" <<<"$html"; then
              echo "live site serves $EXPECTED_SCRIPT"; exit 0
            fi
            echo "attempt $attempt: live site does not yet serve $EXPECTED_SCRIPT"
            sleep 6
          done
          echo "::error::live site never served the new build fingerprint"; exit 1

      - name: Verify routes and boundary
        run: |
          set -euo pipefail
          check() {
            expected="$2"
            actual="$(curl -fsS -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "https://labs.ratifyprotocol.com$1" || true)"
            test "$actual" = "$expected" || { echo "::error::$3 expected $expected got $actual"; return 1; }
            echo "ok $3"
          }
          check / 200 'GET /'
          check /copilot 200 'GET /copilot'
          check /google-adk 200 'GET /google-adk'
          check /langchain 200 'GET /langchain'
          check /nvidia-openshell-nooa 200 'GET /nvidia-openshell-nooa'
          check /maritime 200 'GET /maritime'
          check /this-route-does-not-exist 404 'unknown route'
          check /maritime/api/anything 404 'denied maritime path'
          post="$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://labs.ratifyprotocol.com/maritime)"
          test "$post" = 405 || { echo "::error::POST /maritime expected 405 got $post"; exit 1; }
          header="$(curl -fsS -D - -o /dev/null https://labs.ratifyprotocol.com/maritime | awk -F': ' 'tolower($1)=="x-ratify-labs-reference" {gsub("\r", "", $2); print $2; exit}')"
          test "$header" = maritime || { echo "::error::unexpected reference header: $header"; exit 1; }
